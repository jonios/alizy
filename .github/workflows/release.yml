# Builds the Linux release assets from a version tag and attaches them to a
# DRAFT GitHub Release. Nothing becomes public until a maintainer reviews the
# draft and presses "Publish release".
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    # Must stay on the release baseline: the binaries inherit this glibc (2.35).
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      RUST_VERSION: "1.100.0"
      NODE_VERSION: "24.22.3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches the project version
        run: |
          ver=$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)
          [[ "$TAG" == "v$ver" ]] || { echo "tag $TAG does not match version $ver"; exit 1; }

      - name: System packages
        run: |
          sudo apt-get update
          xargs -a scripts/release/build-deps.txt sudo apt-get install -y --no-install-recommends

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build, test and assemble
        run: OUT=dist-release scripts/release/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: alizy-${{ env.TAG }}-linux-x86_64
          path: dist-release/*
          if-no-files-found: error

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          {
            echo "## Install"
            echo
            echo "Download \`Alizy-x86_64.AppImage\`, \`alizy-installer-x86_64\` and \`SHA256SUMS\` into one folder, then:"
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS'
            echo 'chmod +x alizy-installer-x86_64 Alizy-x86_64.AppImage'
            echo './alizy-installer-x86_64'
            echo '```'
            echo
            echo "Full guide: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALLATION.md"
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist-release/SHA256SUMS
            echo '```'
          } > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Alizy ${TAG#v}" --notes-file "$notes" dist-release/*
          fi
