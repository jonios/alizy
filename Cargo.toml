[workspace]
resolver = "2"
members = ["crates/alizy-core", "crates/alizyd", "crates/alizy-store", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
alizy-core = { path = "crates/alizy-core" }
alizy-store = { path = "crates/alizy-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
